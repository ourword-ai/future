name: resolver
on:
  schedule:
    - cron: "30 9 * * *"     # daily 09:30 UTC — after the scouts post
  workflow_dispatch:
permissions:
  issues: write
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve due predictions (verify by re-checking the public metric)
        env:
          GH_TOKEN: ${{ github.token }}
          # GitHub Models retired 2026-07-30 — point these at any OpenAI-compatible endpoint
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python scouts/resolver.py
      - name: Commit
        run: |
          git config user.name "future-scout-bot"
          git config user.email "future-scout-bot@users.noreply.github.com"
          git add findings/
          if git diff --cached --quiet; then echo "nothing resolved"; exit 0; fi
          git commit -m "resolver: grade due predictions"
          for i in 1 2 3 4 5 6; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push retry $i"; sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "push failed"; exit 1
