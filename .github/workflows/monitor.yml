name: monitor
on:
  schedule:
    - cron: "0 10 * * *"     # daily 10:00 UTC — after the resolver
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Heartbeat / health + demand signal
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scouts/monitor.py
      - name: Commit health
        run: |
          git config user.name "future-scout-bot"
          git config user.email "future-scout-bot@users.noreply.github.com"
          git add findings/feed.json
          if git diff --cached --quiet; then echo "health unchanged"; exit 0; fi
          git commit -m "monitor: heartbeat"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $(( (RANDOM % 4) + 2 ))
          done
          echo "push failed"; exit 1
