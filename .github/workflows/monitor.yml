name: monitor
on:
  schedule:
    - cron: "10 * * * *"     # hourly — a watchdog that only runs every 3h is a poor watchdog
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Heartbeat / health + demand signal
        env:
          GH_TOKEN: ${{ github.token }}
          # GitHub Models retired 2026-07-30 — point these at any OpenAI-compatible endpoint
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python scouts/monitor.py
      - name: Commit health
        run: |
          git config user.name "future-scout-bot"
          git config user.email "future-scout-bot@users.noreply.github.com"
          git add findings/feed.json
          if git diff --cached --quiet; then echo "health unchanged"; exit 0; fi
          git commit -m "monitor: heartbeat"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $(( (RANDOM % 4) + 2 ))
          done
          echo "push failed"; exit 1
