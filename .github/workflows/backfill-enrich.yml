name: backfill-enrich
on:
  workflow_dispatch:
permissions:
  contents: write
  models: read
concurrency:
  group: backfill-enrich
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Re-enrich (sharp bilingual copy + picks)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scouts/backfill_enrich.py
      - name: Commit
        run: |
          git config user.name "future-scout-bot"
          git config user.email "future-scout-bot@users.noreply.github.com"
          git add findings/*.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "backfill: sharp bilingual copy + picks"
          for i in 1 2 3 4 5 6; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $(( (RANDOM % 4) + 2 ))
          done
          echo "push failed"; exit 1
