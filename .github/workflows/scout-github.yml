name: scout-github
on:
  schedule:
    - cron: "17 8 * * *"     # daily 08:17 UTC
  workflow_dispatch:
permissions:
  issues: write
  contents: write
concurrency:
  group: future-scout
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run gh-scout
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scouts/github_scout.py
      - name: Commit findings
        run: |
          git config user.name "future-scout-bot"
          git config user.email "future-scout-bot@users.noreply.github.com"
          git add findings/ || true
          if ! git diff --cached --quiet; then
            git commit -m "scout(github): daily findings"
            git pull --rebase --autostash || true
            git push
          else
            echo "no new findings"
          fi
