name: scout-github
on:
  schedule:
    - cron: "17 8 * * *"     # daily 08:17 UTC
  workflow_dispatch:
permissions:
  issues: write
  contents: write
concurrency:
  group: ${{ github.workflow }}   # per-scout — never cancels a different scout
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run gh-scout
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scouts/github_scout.py
      - name: Commit findings (with push retry)
        run: |
          git config user.name "future-scout-bot"
          git config user.email "future-scout-bot@users.noreply.github.com"
          git add findings/ || true
          if git diff --cached --quiet; then echo "no new findings"; exit 0; fi
          git commit -m "scout(github): daily findings"
          for i in 1 2 3 4 5 6; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push race, retry $i"; sleep $(( (RANDOM % 6) + 3 ))
          done
          echo "push failed after retries"; exit 1
