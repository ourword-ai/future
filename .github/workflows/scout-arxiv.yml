name: scout-arxiv
on:
  schedule:
    - cron: "57 8 * * *"     # daily 08:57 UTC
  workflow_dispatch:
permissions:
  issues: write
  contents: write
concurrency:
  group: future-scout
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run arxiv-scout
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scouts/arxiv_scout.py
      - name: Commit findings
        run: |
          git config user.name "future-scout-bot"
          git config user.email "future-scout-bot@users.noreply.github.com"
          git add findings/ || true
          if ! git diff --cached --quiet; then
            git commit -m "scout(arxiv): daily findings"
            git pull --rebase --autostash || true
            git push
          else
            echo "no new findings"
          fi
