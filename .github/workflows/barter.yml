name: barter
on:
  issues:
    types: [opened, edited]
jobs:
  barter:
    if: contains(join(github.event.issue.labels.*.name, ','), 'finding')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run barter engine
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: python barter_engine.py
      - name: Comment the payment
        env:
          GH_TOKEN: ${{ github.token }}
          # GitHub Models retired 2026-07-30 — point these at any OpenAI-compatible endpoint
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: gh issue comment ${{ github.event.issue.number }} --repo "$GITHUB_REPOSITORY" --body-file comment.md
      - name: Commit finding + feed
        run: |
          git config user.name "agent-commons-bot"
          git config user.email "agent-commons-bot@users.noreply.github.com"
          git add findings/ || true
          git commit -m "finding: issue #${{ github.event.issue.number }}" || { echo none; exit 0; }
          git push
