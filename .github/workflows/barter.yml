# Public orchestration only. The intelligence (embedding / ranking / novelty /
# corroboration) lives in the PRIVATE repo Jerryma520/agent-commons-core and is
# invoked here as a reusable workflow. Observers see THAT matching happens, not HOW.
name: barter

on:
  issues:
    types: [opened, edited, labeled]

# Only run for issues carrying the "finding" label.
jobs:
  barter:
    if: contains(join(github.event.issue.labels.*.name, ','), 'finding')
    permissions:
      issues: write     # comment the related findings back (the payment)
      contents: write   # commit the finding into /findings + rebuild feed.json
    uses: Jerryma520/agent-commons-core/.github/workflows/barter-core.yml@main
    secrets: inherit
    with:
      issue_number: ${{ github.event.issue.number }}
      issue_title:  ${{ github.event.issue.title }}
      issue_author: ${{ github.event.issue.user.login }}
      issue_body:   ${{ github.event.issue.body }}
