name: translate
on:
  schedule:
    - cron: "20 * * * *"    # twice an hour (:20 & :50) — bilingual safety-net, redundant vs dropped runs
    - cron: "50 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  models: read
concurrency:
  group: translate          # own group — never fights a scout
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Translate any findings missing 中文 (auto, capped)
        env:
          GH_TOKEN: ${{ github.token }}
          # GitHub Models retired 2026-07-30 — point these at any OpenAI-compatible endpoint
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          TRANSLATE_CAP: "8"
        run: python scouts/translate_fill.py
      - name: Commit (conflict-safe; feed regenerated from merged set)
        run: |
          git config user.name "future-scout-bot"
          git config user.email "future-scout-bot@users.noreply.github.com"
          git add findings/*.json
          git reset -q -- findings/feed.json 2>/dev/null || true
          git checkout -q -- findings/feed.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to translate"; exit 0; fi
          git commit -m "translate: fill missing 中文"
          ok=0
          for i in $(seq 1 8); do
            if git pull --rebase --autostash origin main && git push; then ok=1; break; fi
            echo "finding push retry $i"; sleep $(( (RANDOM % 5) + 2 ))
          done
          [ "$ok" = 1 ] || { echo "finding push failed"; exit 1; }
          python -c "import sys;sys.path.insert(0,'scouts');import scout_lib as s;s.refresh()"
          git add findings/feed.json
          if git diff --cached --quiet; then echo "feed unchanged"; exit 0; fi
          git commit -m "translate: rebuild feed"
          for i in $(seq 1 8); do
            if git push; then echo "feed pushed"; exit 0; fi
            git fetch origin main && git reset -q --hard origin/main
            python -c "import sys;sys.path.insert(0,'scouts');import scout_lib as s;s.refresh()"
            git add findings/feed.json
            git diff --cached --quiet || git commit -m "translate: rebuild feed"
            echo "feed push retry $i"; sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "feed push failed"; exit 1
      - name: Refresh SEO/GEO static content (JSON-LD + noscript + sitemap)
        run: |
          git config user.name "future-scout-bot"
          git config user.email "future-scout-bot@users.noreply.github.com"
          python -c "import sys;sys.path.insert(0,'scouts');import scout_lib as s;s.build_seo()"
          git add index.html site/index.html sitemap.xml robots.txt llms.txt llms-full.txt feed.xml i zh
          if git diff --cached --quiet; then echo "seo unchanged"; exit 0; fi
          git commit -m "seo: refresh crawlable index (JSON-LD + noscript)"
          for i in $(seq 1 8); do
            if git pull --rebase --autostash origin main && git push; then echo "seo pushed"; exit 0; fi
            echo "seo push retry $i"; sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "seo push failed"; exit 1
